name: CinemaSeat CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run High-Concurrency Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Spin up Docker Compose Environment
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps

      - name: Verify Health Check Endpoint
        run: |
          curl -fail http://localhost:4000/health || exit 1

      - name: Run Backend Integration & High-Concurrency Test Suite
        run: |
          docker compose exec -T api-service npm test

      - name: Gateway Smoke Test & Webhook Delivery Check
        run: |
          curl -s -X POST http://localhost:9000/charge \
            -H 'Content-Type: application/json' \
            -H 'X-Mock-Mode: deterministic' \
            -d '{"amount":450,"currency":"BDT","booking_ref":"ci_test_ref","callback_url":"http://api-service:4000/webhooks/payment"}'
          sleep 4
          DELIVERY_STATUS=$(curl -s "http://localhost:9000/debug/deliveries?booking_ref=ci_test_ref")
          echo "$DELIVERY_STATUS"
          echo "$DELIVERY_STATUS" | grep -q '"ok":true' || exit 1

      - name: Tear Down Environment
        if: always()
        run: |
          docker compose down -v
